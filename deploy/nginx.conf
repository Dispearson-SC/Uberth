server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The dashboard is the site. Nobody should have to know it lives at
    # /src/viz/dashboard.html to see it.
    location = / {
        return 302 /src/viz/dashboard.html;
    }

    # The page must NOT be cached, and this is not a precaution -- it is the
    # single most time-wasting thing that happened while building it. Python's
    # http.server sends no cache headers, the browser cached the page anyway,
    # and every change appeared to do nothing until the URL was busted by
    # hand. A deployed copy that does the same thing is worse, because the
    # person looking at a stale page will not be the person who changed it.
    location ~* \.html$ {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # The recordings are immutable once written: a shift that already happened
    # does not change. Rebuilding one produces a new deploy, and the HTML that
    # names it is uncached, so a long cache here is safe and these files are
    # the bulk of the bytes.
    location ~* \.json$ {
        add_header Cache-Control "public, max-age=3600";
        gzip_static on;
    }

    # The replays are JSON and compress by roughly 5x. Worth turning on for a
    # page whose payload is half a megabyte of recorded ticks.
    gzip on;
    gzip_types application/json text/css application/javascript text/html;
    gzip_min_length 1024;

    # The page fetches ../../replays/ relative to itself, so a missing
    # recording should say so rather than silently return the index.
    location / {
        try_files $uri $uri/ =404;
    }
}
